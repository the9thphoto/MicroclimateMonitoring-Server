name: build

on:
  push:
    tags:
      - "build-*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version tag
        run: |
          version="${GITHUB_REF_NAME#build-}"
          echo "version=$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
