name: microclimate

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: weather
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - weather-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weather"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: microclimate-api:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: postgresql://weather:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/weather
      CORS_ORIGINS: ${CORS_ORIGINS:-http://10.126.126.78:8080}
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    image: microclimate-web:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  weather-data:
